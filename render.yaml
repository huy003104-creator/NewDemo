services:
  - type: web
    name: techguard-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: HF_MODEL_REPO
        value: ambatokum/yolov
      - key: HF_TOKEN
        sync: false
      - key: HF_YOLO_FILENAME
        value: yolov8n.pt
      - key: HF_RESNET_FILENAME
        value: violence_resnet18.pth
